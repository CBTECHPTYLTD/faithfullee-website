<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FaithfulLee | Coming Soon</title>

<meta name="description" content="FaithfulLee - Faithful in His love, grounded in purpose.">

<style>
:root{
    --bg:#f8f5ef;
    --bg2:#f3e6da;
    --sage:#7A8560;
    --peach:#f3c9af;
    --brown:#5c4635;
    --text:#4f453c;
    --glass:rgba(255,255,255,0.75);
    --border:rgba(122,133,96,0.18);
    --shadow:0 25px 70px rgba(92,70,53,0.15);
    --radius:32px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:"Segoe UI", Arial, sans-serif;
    color:var(--text);

    background:
        radial-gradient(circle at 15% 10%, rgba(243,201,175,0.45), transparent 30%),
        radial-gradient(circle at 85% 10%, rgba(170,181,139,0.35), transparent 25%),
        linear-gradient(180deg, var(--bg), var(--bg2));

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;
}

.card{
    width:100%;
    max-width:1000px;

    text-align:center;

    background:var(--glass);

    backdrop-filter:blur(18px);

    border:1px solid var(--border);

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    padding:60px 40px;
}

.logo{
    width:min(700px,95%);
    height:auto;
    display:block;
    margin:0 auto 20px auto;
}

h1{
    color:var(--brown);
    font-size:clamp(2.5rem,5vw,4.5rem);
    letter-spacing:4px;
    margin-bottom:20px;
}

.subtitle{
    color:var(--sage);
    font-size:1.3rem;
    margin-bottom:25px;
}

.divider{
    width:140px;
    height:4px;
    margin:0 auto 30px auto;
    border-radius:999px;
    background:linear-gradient(
        90deg,
        var(--sage),
        var(--peach)
    );
}

.description{
    max-width:650px;
    margin:0 auto;
    font-size:1.05rem;
    line-height:1.8;
}

.footer{
    margin-top:40px;
    color:var(--sage);
    font-size:.95rem;
}

@media(max-width:768px){
    .card{
        padding:35px 20px;
    }

    .subtitle{
        font-size:1.1rem;
    }

    .description{
        font-size:1rem;
    }
}
</style>
</head>

<body>

<div class="card">

    <img
        src="https://www.faithfullee.au/logo.png"
        alt="FaithfulLee Logo"
        class="logo">

    <h1>COMING SOON</h1>

    <p class="subtitle">
      ider"></div>

    <p class="description">
        FaithfulLee is preparing a beautiful collection designed to inspire,
        encourage and celebrate a life grounded in faith, hope and purpose.
        We look forward to sharing our journey with you very soon.
    </p>

    <div class="footer">
        © 2026 FaithfulLee
    </div>

</div>

</body>
</html>
